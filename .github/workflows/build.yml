name: Build and Push Docker Image

on:
  # Build only on manual run — pushing commits/tags no longer triggers a build.
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to push (e.g. v1.2.0 or 1.2.0-rc1). If empty, derives tag from git ref + commit SHA."
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ghcr.io/<owner>/<repo>

jobs:
  build-and-push:
    name: Build (linux/amd64 + arm64) and Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # Tag computation (manual dispatch only):
      #   - version input  → ghcr.io/<owner>/<repo>:<version>   (e.g. v1.2.0)
      #   - current branch → ghcr.io/<owner>/<repo>:<branch>
      #   - always         → ghcr.io/<owner>/<repo>:sha_<commit>
      #   - default branch → ghcr.io/<owner>/<repo>:latest
      # ------------------------------------------------------------------
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=long,prefix=sha_
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Echo image digest
        run: |
          echo "Built images:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build-and-push.outputs.digest }}"
